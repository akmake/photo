<!doctype html>
<!--
  The document stays dir="ltr" while the NEW shell sets dir="rtl" on its own
  root. The screens built before the design direction (album, lab, the old
  studio screens) were laid out against an LTR frame with RTL islands; flipping
  the document would mirror all of them at once with nothing verified. So the
  flip travels with the rewrite, screen by screen, instead of landing as one
  unverifiable change.

  Fonts: IBM Plex Sans Hebrew (interface) + IBM Plex Mono (filenames, counters,
  EXIF, every figure that lines up in a column). TODO before packaging —
  self-host the woff2 files: an installed desktop app must not depend on a CDN
  to render its own text.

  Until then the sheet is loaded NON-BLOCKING (preload + rel-swap on load). As a
  plain <link rel="stylesheet"> it was render-blocking: the browser painted
  nothing at all until fonts.googleapis.com answered, so a slow DNS lookup or a
  throttled CDN turned into seconds of white screen on every single load. The
  fallback stack in design/tokens.css (Segoe UI / Consolas) carries the first
  paint, and Plex swaps in when it arrives.

  The title lost "מערכת ההפעלה של הצלמות": the market is general and the copy is
  masculine now, and the tagline claimed a category that four of twelve sections
  actually delivered.
-->
<html lang="he" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="preload"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>TEZA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
