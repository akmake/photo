<!doctype html>
<!--
  dir="ltr" with lang="he" is deliberate, not a mistake.

  The FRAME is left-to-right: the sidebar sits on the left and the project
  stages run upload -> cull -> pick -> edit -> album from left to right, because
  that strip is a process and the design reads it as a timeline. Every block of
  Hebrew inside the frame sets `direction: rtl` for itself (see shell.css), so
  text, numbers and punctuation are correct while the layout stays as designed.
-->
<html lang="he" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TEZA AI — מערכת ההפעלה של הצלמות</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
