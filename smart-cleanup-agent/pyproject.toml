[project]
name = "smart-cleanup-agent"
version = "0.1.0"
description = "Standalone local vision, segmentation, and restoration agent"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.10,<2",
  "fastapi>=0.116,<1",
  "huggingface-hub>=0.34,<1",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.11,<5",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "safetensors>=0.6,<1",
  "transformers>=4.57,<6",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
