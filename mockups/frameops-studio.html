const state={step:0,unlocked:0,photos:[],selected:0,look:0,light:0,warm:0,contrast:0,before:false,applied:false,exported:false,busy:false};
const labels=['הוספת תמונות','בחירת דוגמה','עריכה','בדיקה וייצוא'];
const main=document.querySelector('#main');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){document.querySelector('#toast').textContent=t;document.querySelector('#toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>document.querySelector('#toast').classList.add('hidden'),3500)}
function photo(i){return state.photos[i]?.url||demo[i%3]}
function filter(){return `brightness(${1+state.light/150}) saturate(${1+state.warm/150}) sepia(${Math.max(0,state.warm)/250}) contrast(${1+state.contrast/150})`}
function go(n){if(state.busy)return;if(n>state.unlocked)return;state.step=n;render()}
function loadDemo(){state.photos=demo.map((url,i)=>({url,name:['DSC_2041.jpg','DSC_2042.jpg','DSC_2043.jpg'][i]}));state.unlocked=1;state.step=1;render()}
function render(){document.querySelector('.steps').innerHTML=labels.map((s,i)=>`<button class="step ${i===state.step?'active':''} ${i<state.step?'done':''}" ${i>state.unlocked?'disabled':''} data-step="${i}" ${i===state.step?'aria-current="step"':''}><b>${i<state.step?'✓':i+1}</b>${s}</button>`).join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(+b.dataset.step));document.querySelector('#projectname').textContent=state.photos.length?'הצילומים שלי':'סיפור חדש מתחיל כאן';document.querySelector('#projectmeta').textContent=state.photos.length?`${state.photos.length} תמונות · ${state.applied?'העריכה הוחלה':'המקור נשמר תמיד'}`:'מהצילום הראשון ועד התמונה המוכנה';if(state.step===0)importScreen();if(state.step===1)selectScreen();if(state.step===2)editScreen();if(state.step===3)exportScreen()}
function importScreen(){main.innerHTML=`<section class="page"><div class="intro"><div><div class="eyebrow">YOUR NEXT GREAT STORY</div><h1>פחות עבודה.<br>יותר מהצילום שלך.</h1><p>מגדירים את המראה על תמונה אחת. ממשיכים עם כל הסדרה.</p></div><span class="muted small">01 / מתחילים עם התמונות</span></div><div class="importbox" id="drop"><div class="importcopy"><h2>איזה סיפור עורכים היום?</h2><p>הוסף את הצילומים שלך, בחר תמונת דוגמה וצור את המראה שמתאים לסדרה.</p><button class="primary" id="choose">＋ הוספת תמונות</button><span class="muted small" style="margin-top:15px">או גרור תמונות לכאן · JPG, PNG, WebP</span></div><div class="importvisual"><img src="${demo[0]}" alt="צילום ילדה באור סתווי"><div class="caption">האור שלך. החתימה שלך.<small>THE FRAMEOPS EXPERIENCE</small></div></div></div><div class="below"><span class="muted small">קודם רואים את התוצאה. אחר כך מחילים על הסדרה.</span><button id="demo">להתנסות עם צילומי דוגמה ←</button></div><div class="sources">רפרנסים שנבדקו ב־Mobbin: <a href="https://mobbin.com/screens/5ada6f2e-a1e2-4a3b-af69-7b232eed2b94" target="_blank" rel="noopener">Frame.io — ניהול מדיה</a><a href="https://mobbin.com/screens/f9db9b4b-c8e4-4345-98b4-c334c0181b6b" target="_blank" rel="noopener">Higgsfield — תמונה במרכז</a><a href="https://mobbin.com/screens/c3a97dfe-e2ec-4ea2-826a-53f0d6a2eb4b" target="_blank" rel="noopener">Obvious — כלי התאמה</a></div></section>`;document.querySelector('#choose').onclick=()=>document.querySelector('#files').click();document.querySelector('#demo').onclick=loadDemo;const drop=document.querySelector('#drop');drop.ondragover=e=>{e.preventDefault();drop.style.borderColor='var(--accent)'};drop.ondragleave=()=>drop.style.borderColor='';drop.ondrop=e=>{e.preventDefault();drop.style.borderColor='';importFiles(e.dataTransfer.files)}}
function selectScreen(){main.innerHTML=`<section class="page"><div class="intro"><div><div class="eyebrow">ONE FRAME. THE WHOLE STORY.</div><h1>עם איזו תמונה מתחילים?</h1><p>בחר תמונה שמייצגת את האור והצבעים בסדרה שלך.<br>עליה נגדיר את המראה, לפני שנחיל אותו על כולן.</p></div><span class="muted small">02 / בחירת תמונת דוגמה</span></div><div class="collection">${state.photos.map((p,i)=>`<button class="photo-card ${state.selected===i?'selected':''}" data-photo="${i}" aria-pressed="${state.selected===i}"><img src="${p.url}" alt="${esc(p.name)}"><span class="pick">${state.selected===i?'✓':''}</span><div class="info"><b dir="ltr">${esc(p.name)}</b><span class="muted small">${state.selected===i?'תמונת הדוגמה שלך':'בחירה כדוגמה'}</span></div></button>`).join('')}</div><div class="callout">טיפ קטן: תמונה עם פנים ברורות ותאורה טיפוסית תעזור לך לקבל החלטה שמתאימה לסדרה.</div><div class="below"><button class="quiet" id="back">→ חזרה</button><button class="primary" id="next">עריכת התמונה שבחרתי ←</button></div></section>`;document.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.photo;render()});document.querySelector('#back').onclick=()=>go(0);document.querySelector('#next').onclick=()=>{state.unlocked=Math.max(state.unlocked,2);go(2)}}
function editScreen(){main.innerHTML=`<div class="editor"><aside class="inspector"><div class="eyebrow">MAKE IT YOURS</div><h2>המראה של הסדרה</h2><p class="muted small">בחר נקודת התחלה וכוון בעדינות.<br>התוצאה מופיעה מיד בתמונה.</p><div class="sectionlabel">מתחילים עם סגנון</div><div class="looks">${['טבעי','אור חם','קולנועי'].map((name,i)=>`<button class="look ${state.look===i?'active':''}" data-look="${i}" aria-pressed="${state.look===i}"><img src="${photo(state.selected)}" style="filter:${['none','sepia(.25) saturate(1.2)','contrast(1.18) saturate(.75)'][i]}" alt="">${name}</button>`).join('')}</div>${control('light','בהירות',state.light)}${control('warm','חמימות',state.warm)}${control('contrast','ניגודיות',state.contrast)}<button class="quiet small" id="reset">איפוס העריכה</button><details><summary>איך לבחור את המראה?</summary><p class="muted small" style="line-height:1.9;margin-top:12px">טבעי שומר על אופי הצילום. אור חם מתאים לרגעים רכים. קולנועי נותן עומק וניגודיות. בחר מה מחמיא לצילום שלך, והשתמש ב״לפני״ כדי להשוות.</p></details><div class="callout small">כרגע עורכים רק את הדוגמה.<br>שאר התמונות יישארו כפי שהן עד שתבחר להחיל את המראה.</div></aside><section class="editstage"><div class="stagetools"><span dir="ltr">${esc(state.photos[state.selected].name)}</span><div class="segmented"><button id="before" class="${state.before?'active':''}" aria-pressed="${state.before}">לפני</button><button id="after" class="${!state.before?'active':''}" aria-pressed="${!state.before}">אחרי</button></div><span>תמונה ${state.selected+1} מתוך ${state.photos.length}</span></div><div class="canvas"><img id="hero" src="${photo(state.selected)}" style="filter:${state.before?'none':filter()}" alt="תצוגה מקדימה של תמונת הדוגמה"><span class="canvaslabel" id="canvaslabel">${state.before?'התמונה המקורית':'תצוגת המראה שלך'}</span></div><div class="filmstrip">${state.photos.map((p,i)=>`<button class="${i===state.selected?'active':''}" data-frame="${i}" aria-label="הצגת תמונה ${i+1}" aria-pressed="${i===state.selected}"><img src="${p.url}" alt=""></button>`).join('')}</div><div class="editbottom"><button class="quiet" id="back">→ בחירת דוגמה</button><p>מרוצה מהמראה?<br>השלב הבא מחיל אותו על ${state.photos.length} התמונות.</p><button class="primary" id="apply">החלת המראה על הסדרה ←</button></div></section></div>`;document.querySelectorAll('[data-look]').forEach(b=>b.onclick=()=>{state.look=+b.dataset.look;[state.light,state.warm,state.contrast]=[[0,0,0],[8,25,4],[-4,-10,23]][state.look];state.before=false;state.applied=false;render()});['light','warm','contrast'].forEach(k=>document.querySelector('#'+k).oninput=e=>{state[k]=+e.target.value;state.applied=false;document.querySelector('#'+k+'value').textContent=(state[k]>0?'+':'')+state[k];document.querySelector('#hero').style.filter=state.before?'none':filter()});document.querySelector('#before').onclick=()=>{state.before=true;render()};document.querySelector('#after').onclick=()=>{state.before=false;render()};document.querySelector('#reset').onclick=()=>{state.light=state.warm=state.contrast=state.look=0;state.applied=false;render()};document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.frame;render()});document.querySelector('#back').onclick=()=>go(1);document.querySelector('#apply').onclick=()=>{state.applied=true;state.exported=false;state.unlocked=3;go(3);toast('המראה הוחל בתצוגת ההדגמה. אפשר לבדוק לפני הייצוא.')}}
function control(id,label,value){return `<div class="control"><div class="controllabel"><label for="${id}">${label}</label><output id="${id}value" for="${id}">${value>0?'+':''}${value}</output></div><input id="${id}" type="range" min="-40" max="40" value="${value}"></div>`}
function exportScreen(){if(state.exported){main.innerHTML=`<section class="page success"><div class="check">✓</div><div class="eyebrow" style="text-align:center">READY FOR THE NEXT CHAPTER</div><h1>ככה נראה סוף עבודה טוב.</h1><p>זרימת הייצוא הושלמה בהדגמה.<br>בתוכנה המחוברת למנוע, התמונות הערוכות יישמרו בתיקייה שבחרת, לצד המקור שנשמר.</p><button class="primary" id="again">חזרה לתמונות ←</button><p class="small">זהו עיצוב אינטראקטיבי. לא נוצרו קבצים.</p></section>`;document.querySelector('#again').onclick=()=>{state.exported=false;render()};return}main.innerHTML=`<section class="page"><div class="intro"><div><div class="eyebrow">THE FINAL TOUCH</div><h1>עוד מבט. וזה מוכן.</h1><p>המראה הוחל על ${state.photos.length} התמונות בתצוגה. בדוק שהסדרה מרגישה בדיוק שלך.</p></div><button id="revise">→ חזרה לשיפור המראה</button></div><div class="exportlayout"><div><div class="exportpreview">${state.photos.map((p,i)=>`<button class="photo-card" data-review="${i}" aria-label="בדיקת ${esc(p.name)}"><img src="${p.url}" style="filter:${filter()}" alt="${esc(p.name)}"></button>`).join('')}</div><div class="callout small">משהו לא מתאים? לחץ על תמונה כדי לחזור לבדוק אותה במסך העריכה.</div></div><div class="exportpanel"><h2>איך תרצה לשמור?</h2><p class="muted small" style="margin-top:8px">עותקים חדשים. התמונות המקוריות נשמרות.</p><div class="field"><label for="destination">שם תיקיית התמונות המוכנות</label><input id="destination" type="text" value="הצילומים שלי — מוכן למסירה"></div><div class="field"><label for="format">למה התמונות מיועדות?</label><select id="format"><option>מסירה ללקוח · JPG באיכות גבוהה</option><option>הדפסה · JPG באיכות מרבית</option><option>תצוגה באינטרנט · JPG מוקטן</option></select></div><div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:20px"><span class="muted">תמונות מוכנות</span><strong>${state.photos.length}</strong></div><div class="progress hidden" id="progress"><span></span></div><button class="primary" id="export">שמירת ${state.photos.length} התמונות ←</button><p class="muted small" style="line-height:1.8;margin-top:13px">בהדגמה הזו נציג את תהליך השמירה בלבד.<br>בחירת תיקייה ועיבוד מלא יתחברו במוצר עצמו.</p></div></div></section>`;document.querySelector('#revise').onclick=()=>go(2);document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.review;go(2)});document.querySelector('#export').onclick=()=>{if(!document.querySelector('#destination').value.trim()){toast('תן שם לתיקייה כדי להמשיך');document.querySelector('#destination').focus();return}state.busy=true;document.querySelector('#export').disabled=true;document.querySelector('#export').textContent='מדגימים את השמירה…';document.querySelector('#progress').classList.remove('hidden');let n=0;const t=setInterval(()=>{n+=25;document.querySelector('#progress span').style.width=n+'%';if(n===100){clearInterval(t);state.busy=false;state.exported=true;render()}},300)}}
function importFiles(files){const accepted=Array.from(files).filter(f=>/^image\/(jpeg|png|webp)$/.test(f.type));if(!accepted.length){toast('בחר תמונות JPG, PNG או WebP. קובצי RAW יהיו זמינים בתוכנה המלאה.');return}state.photos.forEach(p=>{if(p.url.startsWith('blob:'))URL.revokeObjectURL(p.url)});state.photos=accepted.map(f=>({name:f.name,url:URL.createObjectURL(f)}));state.selected=0;state.applied=false;state.exported=false;state.unlocked=1;state.step=1;state.look=state.light=state.warm=state.contrast=0;render()}
document.querySelector('#files').onchange=e=>importFiles(e.target.files);document.querySelector('#home').onclick=()=>go(0);document.querySelector('#help').onclick=()=>toast(['הוסף תמונות או פתח את צילומי הדוגמה כדי להתחיל.','בחר תמונה עם תאורה שמייצגת את רוב הסדרה.','בחר סגנון, כוון את המראה והשווה בעזרת לפני ואחרי.','בדוק את התמונות, בחר שימוש והמשך לשמירה.'][state.step]);document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(state.step===2&&e.key==='\\'){state.before=!state.before;render()}if(state.step===2&&['ArrowLeft','ArrowRight'].includes(e.key)){state.selected=(state.selected+(e.key==='ArrowLeft'?1:-1)+state.photos.length)%state.photos.length;render()}});render();
</script></body></html>
