document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){page=b.dataset.nav;draw()}if(b.dataset.job!==undefined)open(+b.dataset.job);if(b.dataset.open)open(0,b.dataset.open);if(b.dataset.stage){stage=b.dataset.stage;draw()}if(b.dataset.send){sendMode=b.dataset.send;draw()}if(b.dataset.photo!==undefined){current=+b.dataset.photo;draw()}if(b.dataset.edit!==undefined){current=+b.dataset.edit;stage='עריכה';draw()}if(b.dataset.group!==undefined){stage='סינון';draw()}if(b.dataset.remove!==undefined){albums.splice(+b.dataset.remove,1);draw()}if(b.dataset.album!==undefined){clientAlbum=+b.dataset.album;picked=albumPicks[clientAlbum]??(albumPicks[clientAlbum]=new Set());draw()}if(b.dataset.pick!==undefined){const n=+b.dataset.pick;if(picked.has(n))picked.delete(n);else if(picked.size<albums[clientAlbum].quota)picked.add(n);else toast('המכסה מלאה. הסר תמונה כדי לבחור אחרת.');draw()}const a=b.dataset.action;if(a==='new'){newProject();return}else if(a==='add'){albums.push({name:'אלבום נוסף',quota:30});draw()}else if(a==='publish'){if(!albums.length||albums.some(a=>!a.name.trim()||a.quota<1)){toast('הוסף אלבום עם שם ומכסה תקינה.');return}sendMode='waiting';draw();toast('מעבר הדגמה למעקב בחירה. לא נוצרה גלריה בשרת.')}else if(a==='finish'){if(!picked.size){toast('בחר לפחות תמונה אחת.');return}toast('הבחירה נשמרה בהדגמה המקומית בלבד.')}else if(a==='before'){before=!before;document.querySelector('#editimg').style.filter=before?'none':`brightness(${1+(+document.querySelector('#light').value)/100}) contrast(${1+(+document.querySelector('#contrast').value)/100})`;b.textContent=before?'חזרה לעריכה':'לפני / אחרי'}else if(a==='apply')toast('הדגמה: היקף ההחלה הוא '+document.querySelector('#scope').value+'. לא נערכו קבצים.');else if(a)toast({import:'ייבוא תיקייה פועל בתוכנה. בהדגמה לא ניגשים לקבצים.',proof:'אישור אלבום הוא מסלול נפרד מבחירת התמונות. המסך המפורט טרם נבנה.',link:'פרטי גישה אינם נוצרים בהדגמה.',folder:'בחירת תיקייה פועלת בתוכנה. כאן לא משנים את הגדרות המחשב.',tour:'ההדרכה תותאם למסכים החדשים לאחר הכרעת האפיון.',check:'בדיקת המנוע פעילה בתוכנה. כאן מוצגים מצבי הדגמה.'}[a])});document.addEventListener('input',e=>{const t=e.target;if(t.id==='search'){page='projects';draw()}if(t.dataset.name!==undefined)albums[+t.dataset.name].name=t.value;if(t.dataset.quota!==undefined)albums[+t.dataset.quota].quota=Math.max(1,+t.value||1);if(['light','contrast'].includes(t.id)){before=false;document.querySelector('#'+t.id+'Out').textContent=t.value;document.querySelector('#editimg').style.filter=`brightness(${1+(+document.querySelector('#light').value)/100}) contrast(${1+(+document.querySelector('#contrast').value)/100})`}});draw();

function businessView(){if(page==='clients')return '<div class="head"><div><h1>לקוחות</h1><p>אנשים, פרטי קשר והעבודות שלהם · נתוני דוגמה</p></div></div><div class="compact">'+jobs.map((j,i)=>'<button class="task" data-job="'+i+'"><span class="avatar">'+j.name.slice(-1)+'</span><span><b>'+j.name+'</b><small>'+j.type+' · פרויקט אחד</small></span><span class="arr">פתיחת העבודה ←</span></button>').join('')+'</div>';if(page==='calendar')return '<div class="head"><div><h1>יומן צילומים</h1><p>אוקטובר 2026 · הצילומים מקושרים לפרויקטים</p></div></div><div class="twocol"><section class="panel pad"><div class="paneltitle"><h2>אוקטובר</h2><span class="count">חודש לדוגמה</span></div><div class="calendar-grid">'+['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'].map(d=>'<div class="dow">'+d+'</div>').join('')+Array.from({length:35},(_,i)=>{const d=i-3;const p=[8,15,22].indexOf(d);return '<'+(p>=0?'button data-job="'+p+'"':'div')+' class="day '+(p>=0?'event':'')+'">'+(d>0&&d<32?d:'')+(p>=0?'<small>'+jobs[p].name+'</small>':'')+'</'+(p>=0?'button':'div')+'>'}).join('')+'</div></section><section class="panel pad"><h2>הצילומים הקרובים</h2>'+jobs.map((j,i)=>'<button class="task" data-job="'+i+'"><span><b>'+j.name+'</b><small>'+[8,15,22][i]+' באוקטובר · '+j.type+'</small></span><span class="arr">←</span></button>').join('')+'</section></div>';return '<div class="head"><div><h1>הגדרות המערכת</h1><p>תיקיית העבודה, המנוע והדרכות המערכת</p></div></div><div class="twocol"><section class="panel pad"><h2>תיקיית העבודה</h2><p style="margin:16px 0;font-size:12px">המיקום שבו נוצרות העבודות החדשות שלך.</p><div class="source"><span>תיקיית הסטודיו · דוגמה</span><span>▣</span></div><button class="btn secondary" style="margin-top:17px" data-action="folder">בחירת תיקייה אחרת</button><div class="paneltitle" style="margin-top:35px"><h2>הדרכות</h2></div><p style="font-size:12px">אפשר לחזור להסברים מתוך כל מסך.</p><button class="btn secondary" style="margin-top:15px" data-action="tour">הדרכת היכרות</button></section><section class="panel pad"><h2>מצב המערכת</h2><div class="detailrow"><span>המנוע המקומי</span><span class="tag">מחובר · דוגמה</span></div><div class="detailrow"><span>פרויקטים</span><b>'+jobs.length+'</b></div><p class="hint" style="margin:17px 0">מצבי הדגמה בלבד. ההצעה אינה בודקת את חיבור המנוע.</p><button class="btn secondary" data-action="check">בדיקת חיבור</button></section></div>'}
function newProject(){const modal=document.createElement('dialog');modal.innerHTML='<form method="dialog"><div class="paneltitle"><h2>פרויקט חדש</h2><button value="cancel" formnovalidate aria-label="סגירה">×</button></div><p class="hint">הפרויקט נוצר בדוגמה המקומית בלבד.</p><label class="formlabel" for="jobname">שם הלקוח / העבודה</label><input id="jobname" class="field" required placeholder="למשל, משפחת לוי"><label class="formlabel" for="jobtype">סוג צילום</label><select id="jobtype" class="field"><option>צילומי משפחה</option><option>חתונה</option><option>ניו בורן</option><option>צילום מסחרי</option></select><div class="dialog-actions"><button value="cancel" class="btn secondary" formnovalidate>ביטול</button><button value="create" class="btn orange">צור פרויקט</button></div></form>';document.body.append(modal);modal.addEventListener('close',()=>{if(modal.returnValue==='create'){jobs.push({name:modal.querySelector('#jobname').value,type:modal.querySelector('#jobtype').value,state:'פרויקט חדש',photo:0,n:0});open(jobs.length-1,'ייבוא')}modal.remove()});modal.showModal()}
</script></body></html>
