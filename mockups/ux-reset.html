<title>FrameOps — כיוון חדש</title>
<style>
@font-face{font-family:Plex;src:url('/node_modules/@fontsource/ibm-plex-sans-hebrew/files/ibm-plex-sans-hebrew-hebrew-400-normal.woff2')}@font-face{font-family:Plex;src:url('/node_modules/@fontsource/ibm-plex-sans-hebrew/files/ibm-plex-sans-hebrew-hebrew-600-normal.woff2');font-weight:600}
:root{--bg:#f4f3ef;--paper:#fff;--ink:#242c29;--muted:#6a746e;--line:#dde1da;--accent:#275943;--soft:#e5eee6;--radius:12px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Plex,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #a9cdb6;outline-offset:3px}button{border:0;background:none;color:inherit}aside{position:fixed;right:0;top:0;bottom:0;width:218px;background:#202e27;color:#eef4ee;padding:30px 20px;display:flex;flex-direction:column}.brand{font-size:25px;letter-spacing:-1px;font-weight:600;text-align:right;direction:ltr;margin-bottom:45px}.brand small{display:block;direction:rtl;font-size:11px;letter-spacing:1px;color:#a8b6ac;margin-top:8px}nav{display:grid;gap:7px}.nav{display:flex;gap:12px;align-items:center;padding:12px 15px;border-radius:8px;text-align:right;color:#b9c7bf}.nav.active,.nav:hover{background:#364a3e;color:white}.nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7}.aside-foot{margin-top:auto;border-top:1px solid #415047;padding-top:20px;font-size:13px;color:#a8b6ac}.aside-foot b{display:block;color:#e9f0ea;margin-bottom:5px}main{margin-right:218px}.top{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 44px;background:#fafaf7}.breadcrumb{font-size:13px;color:var(--muted)}.search{width:270px;border:1px solid var(--line);border-radius:8px;padding:9px 13px;background:white}.wrap{padding:40px 44px;max-width:1500px;margin:auto}.eyebrow{font-size:12px;color:var(--muted);margin-bottom:9px}h1{font-size:32px;font-weight:600;letter-spacing:-1px;margin:0 0 10px}h2{font-size:19px;margin:0;font-weight:600}p{color:var(--muted);line-height:1.7;margin:0}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.primary{background:var(--accent);color:white;padding:11px 21px;border-radius:8px;font-weight:600}.secondary{border:1px solid var(--line);background:white;padding:10px 17px;border-radius:8px}.intro{display:grid;grid-template-columns:1.7fr 1fr;gap:22px;margin-bottom:36px}.resume{display:grid;grid-template-columns:1fr 42%;background:#e5ebe1;border:1px solid #d3ddce;border-radius:var(--radius);overflow:hidden;height:260px}.resume-copy{padding:28px}.resume-copy h2{font-size:26px;margin:12px 0 8px}.resume img{width:100%;height:100%;object-fit:cover}.resume .primary{margin-top:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px}.tasks{display:grid;gap:0;margin-top:16px}.task{padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center;text-align:right;width:100%}.task:last-child{border:0}.dot{width:9px;height:9px;border-radius:50%;background:#bd9750;flex-shrink:0}.task small{display:block;color:var(--muted);margin-top:4px}.task .arrow{margin-right:auto}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{text-align:right;display:block;background:white;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;padding:0;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:0 9px 25px #203a2912}.card img{width:100%;height:175px;object-fit:cover;display:block}.cardbody{padding:19px}.cardbody strong{font-size:18px;display:block;margin:12px 0 6px}.pill{font-size:11px;background:var(--soft);color:var(--accent);padding:4px 9px;border-radius:5px}.pill.gold{background:#f3ecd9;color:#7c622c}.cardbottom{border-top:1px solid var(--line);margin-top:18px;padding-top:13px;color:var(--muted);display:flex;justify-content:space-between;font-size:12px}.tabs{display:flex;gap:25px;border-bottom:1px solid var(--line);margin-bottom:25px}.tab{padding:13px 4px;color:var(--muted);border-bottom:3px solid transparent}.tab.active{color:var(--accent);border-color:var(--accent);font-weight:600}.projectlayout{display:grid;grid-template-columns:1fr 300px;gap:24px}.steps{display:grid;gap:12px;margin-top:20px}.step{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:17px;text-align:right;background:white}.step b{display:block}.step small{color:var(--muted);display:block;margin-top:5px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.photo{position:relative;padding:0;border-radius:8px;overflow:hidden;border:3px solid transparent}.photo.selected{border-color:var(--accent)}.photo img{width:100%;height:230px;object-fit:cover;display:block}.photo span{position:absolute;bottom:10px;right:10px;background:#fff;padding:4px 9px;border-radius:5px;font-size:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.editor{display:grid;grid-template-columns:1fr 270px;gap:22px}.canvas{background:#25302b;border-radius:10px;min-height:440px;display:flex;align-items:center;justify-content:center;padding:24px}.canvas img{max-width:100%;max-height:510px;object-fit:contain}.slider{display:block;margin-top:22px}.slider span{display:flex;justify-content:space-between;font-size:13px}.slider input{width:100%;accent-color:var(--accent);margin-top:14px}.note{font-size:12px;line-height:1.7;color:var(--muted);margin-top:20px}.prototype{position:fixed;bottom:12px;left:18px;background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:7px;font-size:11px;color:var(--muted);box-shadow:0 2px 10px #0001}.toast{position:fixed;bottom:55px;left:24px;background:var(--ink);color:white;padding:15px 22px;border-radius:8px;max-width:400px;z-index:10}.empty{text-align:center;padding:55px}.hidden{display:none!important}@media(max-width:1000px){aside{width:175px}main{margin-right:175px}.wrap{padding:28px}.top{padding:0 28px}.intro,.projectlayout{grid-template-columns:1fr}.cards{gap:12px}.card img{height:140px}.editor{grid-template-columns:1fr 220px}}@media(max-width:700px){aside{position:static;width:auto;padding:14px}.brand{margin:0 0 15px;text-align:center}.brand small,.aside-foot{display:none}nav{display:flex;overflow:auto}.nav{white-space:nowrap;padding:8px}.nav svg{display:none}main{margin:0}.top{height:58px;padding:0 20px}.search{width:170px}.wrap{padding:24px 20px}.head{gap:15px}h1{font-size:26px}.intro,.cards,.editor{grid-template-columns:1fr}.resume{grid-template-columns:1fr 35%}.gallery{grid-template-columns:repeat(2,1fr)}.tabs{gap:13px;overflow:auto}.tab{white-space:nowrap}.prototype{position:static;margin:16px;display:inline-block}}
</style>
<aside><button class="brand" data-go="home">FrameOps<small>סביבת העבודה של הסטודיו</small></button><nav id="nav"></nav><div class="aside-foot"><b>הסטודיו שלי</b>סביבת עבודה לצלם<button class="nav" data-go="settings">⚙ הגדרות</button></div></aside>
<main><header class="top"><span class="breadcrumb" id="crumb">הסטודיו שלי / סקירה</span><input class="search" id="search" placeholder="חפש פרויקט…" aria-label="חיפוש פרויקטים"></header><div class="wrap" id="content"></div></main><div class="prototype">הצעת UI/UX · נתוני דוגמה · ללא שינוי בפרויקטים</div><div class="toast hidden" id="toast" role="status"></div>
<script>
const photos=['/public/demo/a.jpg','/public/demo/b.jpg','/public/demo/c.jpg'];const jobs=[{name:'משפחת לוי',kind:'צילומי משפחה',status:'בעריכה',count:148,img:0},{name:'נועה ואיתי',kind:'צילומי זוגיות',status:'ממתין לבחירת לקוח',count:286,img:1},{name:'קולקציית סתיו',kind:'צילום מסחרי',status:'מוכן למסירה',count:64,img:2}];let view='home',tab='סקירה',job=0,selected=0;const content=document.querySelector('#content');const icons=['<path d="M3 10 12 3l9 7v11h-6v-7H9v7H3z"/>','<path d="M3 6h7l2 3h9v12H3z"/>','<circle cx="9" cy="8" r="4"/><path d="M2 21v-3a7 7 0 0 1 14 0v3m1-17a4 4 0 0 1 0 8m2 3a6 6 0 0 1 3 5"/>','<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18"/>'];
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),4000)}
function openJob(i,t='סקירה'){job=i;tab=t;view='project';render()}
function card(j,i){return `<button class="card" data-job="${i}"><img src="${photos[j.img]}" alt="תמונת דוגמה לפרויקט"><div class="cardbody"><span class="pill ${i===1?'gold':''}">${j.status}</span><strong>${j.name}</strong><p>${j.kind}</p><div class="cardbottom"><span>${j.count} תמונות</span><span>פתח פרויקט ←</span></div></div></button>`}
function render(){document.querySelector('#nav').innerHTML=['סקירה','פרויקטים','לקוחות','יומן'].map((n,i)=>`<button class="nav ${view===['home','projects','clients','calendar'][i]||view==='project'&&i===1?'active':''}" data-go="${['home','projects','clients','calendar'][i]}"><svg viewBox="0 0 24 24">${icons[i]}</svg>${n}</button>`).join('');document.querySelector('#crumb').textContent=view==='project'?`פרויקטים / ${jobs[job].name} / ${tab}`:'הסטודיו שלי / '+({home:'סקירה',projects:'פרויקטים',clients:'לקוחות',calendar:'יומן',settings:'הגדרות'}[view]);
if(view==='home'){content.innerHTML=`<div class="head"><div><div class="eyebrow">סביבת העבודה שלך</div><h1>בוא נמשיך מהנקודה האחרונה.</h1><p>העבודות שלך, ומה שצריך לקדם עכשיו.</p></div><button class="primary" data-action="new">＋ פרויקט חדש</button></div><div class="intro"><section class="resume"><div class="resume-copy"><div class="eyebrow">המשך העבודה האחרונה</div><h2>משפחת לוי</h2><p>צילומי משפחה · 148 תמונות<br>השלב הבא: השלמת העריכה</p><button class="primary" data-edit="0">המשך בעריכה ←</button></div><img src="${photos[0]}" alt="צילומי הדוגמה"></section><section class="panel"><h2>דורש תשומת לב</h2><div class="tasks"><button class="task" data-job="1"><span class="dot"></span><span>נועה ואיתי<small>הגלריה ממתינה לבחירה</small></span><span class="arrow">←</span></button><button class="task" data-deliver="2"><span class="dot" style="background:#538265"></span><span>קולקציית סתיו<small>64 תמונות מוכנות למסירה</small></span><span class="arrow">←</span></button></div><p class="note">כל פריט מוביל ישירות לעבודה הרלוונטית.</p></section></div><div class="sectionhead"><h2>הפרויקטים שלך</h2><button data-go="projects">כל הפרויקטים ←</button></div><div class="cards">${jobs.map(card).join('')}</div>`}
else if(view==='projects'){content.innerHTML=`<div class="head"><div><h1>פרויקטים</h1><p>כל עבודה במקום אחד. בחר פרויקט כדי להמשיך.</p></div><button class="primary" data-action="new">＋ פרויקט חדש</button></div><div class="cards">${jobs.map((j,i)=>j.name.includes(document.querySelector('#search').value)?card(j,i):'').join('')}</div>`}
else if(view==='project'){const j=jobs[job];let body='';if(tab==='סקירה')body=`<div class="projectlayout"><section class="panel"><h2>מה עושים עכשיו?</h2><div class="steps"><button class="step" data-tab="תמונות"><span><b>התמונות שלך</b><small>${j.count} תמונות · סינון וארגון קבוצות</small></span><span>←</span></button><button class="step" data-tab="עריכה"><span><b>המשך לעריכה</b><small>כוון תמונה והחל את המראה על סדרה</small></span><span>←</span></button><button class="step" data-tab="מסירה"><span><b>בחירת לקוח ומסירה</b><small>שתף גלריה לבחירה או מסור תוצרים סופיים</small></span><span>←</span></button></div></section><section class="panel"><h2>פרטי העבודה</h2><p style="margin-top:20px">לקוח<br><b>${j.name}</b><br><br>סוג צילום<br><b>${j.kind}</b><br><br>מצב עבודה<br><span class="pill">${j.status}</span></p></section></div>`;
if(tab==='תמונות')body=`<div class="toolbar"><span>3 תמונות דוגמה · לחץ על תמונה לבחירה</span><button class="primary" data-tab="עריכה">ערוך את התמונה ←</button></div><div class="gallery">${photos.map((p,i)=>`<button class="photo ${selected===i?'selected':''}" data-photo="${i}" aria-label="בחר תמונה ${i+1}"><img src="${p}" alt="תמונת דוגמה ${i+1}"><span>${selected===i?'✓ נבחרה':'תמונה '+(i+1)}</span></button>`).join('')}</div>`;
if(tab==='עריכה')body=`<div class="toolbar"><span>תמונה ${selected+1} מתוך 3 · תצוגת הדגמה</span><button class="secondary" data-tab="תמונות">חזרה לתמונות</button></div><div class="editor"><div class="canvas"><img id="preview" src="${photos[selected]}" alt="התמונה בעריכה"></div><section class="panel"><h2>כוונון התמונה</h2><p class="note">התמונה במרכז. הכלים הדרושים לצדה.</p><label class="slider"><span>בהירות <output id="lightOut">0</output></span><input id="light" type="range" min="-40" max="40" value="0"></label><label class="slider"><span>ניגודיות <output id="contrastOut">0</output></span><input id="contrast" type="range" min="-40" max="40" value="0"></label><button class="primary" style="width:100%;margin-top:35px" data-action="apply">החל על הסדרה</button><button class="secondary" style="width:100%;margin-top:10px" data-action="reset">אפס כוונון</button><p class="note">הסליידרים מדגימים שינוי תצוגה בלבד.</p></section></div>`;
if(tab==='אלבום')body=`<section class="panel empty"><h2>אלבום מהתמונות שבחרת</h2><p style="margin:15px 0 25px">אזור נפרד לעיצוב, בדיקה ואישור אלבום.<br>המסך המפורט ייבנה כחלק מהאפיון המלא.</p><button class="secondary" data-tab="תמונות">בחירת תמונות לאלבום</button></section>`;
if(tab==='מסירה')body=`<div class="projectlayout"><section class="panel"><h2>מה תרצה להעביר ללקוח?</h2><div class="steps"><button class="step" data-action="share"><span><b>גלריה לבחירת תמונות</b><small>הלקוח מסמן את התמונות שהוא רוצה</small></span><span>←</span></button><button class="step" data-action="export"><span><b>תמונות סופיות</b><small>שמירת הקבצים הערוכים בתיקייה</small></span><span>←</span></button><button class="step" data-action="album"><span><b>אלבום לאישור</b><small>תצוגה ללקוח עם אפשרות להערות</small></span><span>←</span></button></div></section><section class="panel"><h2>מצב המסירה</h2><p style="margin-top:20px">עדיין לא נשלחה מסירה בהדגמה זו.</p><p class="note">בחירה ומסירה סופית הן פעולות שונות, ונגישות מאותו אזור.</p></section></div>`;
content.innerHTML=`<div class="head"><div><div class="eyebrow">${j.kind}</div><h1>${j.name}</h1><p>${j.count} תמונות · <span class="pill">${j.status}</span></p></div><button class="secondary" data-go="projects">כל הפרויקטים</button></div><div class="tabs">${['סקירה','תמונות','עריכה','אלבום','מסירה'].map(t=>`<button class="tab ${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</div>${body}`}
else{content.innerHTML=`<div class="head"><div><h1>${{clients:'לקוחות',calendar:'יומן',settings:'הגדרות'}[view]}</h1><p>אזור זה נמצא במפת המוצר. העיצוב המפורט שלו עדיין לא נכלל בהצעה.</p></div></div><section class="panel empty"><h2>ההצעה כרגע מתמקדת במסלול העבודה המרכזי</h2><p style="margin:15px 0">סקירה ← פרויקט ← תמונות ← עריכה ← מסירה</p><button class="primary" data-go="home">חזרה לסקירה</button></section>`}
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){view=b.dataset.go;document.querySelector('#search').value='';render()}if(b.dataset.job!==undefined)openJob(+b.dataset.job);if(b.dataset.edit!==undefined)openJob(+b.dataset.edit,'עריכה');if(b.dataset.deliver!==undefined)openJob(+b.dataset.deliver,'מסירה');if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.photo!==undefined){selected=+b.dataset.photo;render()}if(b.dataset.action){const a=b.dataset.action;if(a==='reset'){render();return}toast({new:'יצירת פרויקט תיכלל במסך מפורט בהמשך האפיון.',apply:'הדגמה בלבד: במוצר תוצג בחירת התמונות והיקף ההחלה.',share:'הדגמה בלבד: כאן יוגדרו גלריית הבחירה וקישור הלקוח.',export:'הדגמה בלבד: כאן יוגדרו איכות, פורמט ותיקיית יעד.',album:'הדגמה בלבד: שיתוף אלבום זמין לאחר הכנתו.'}[a])}});document.addEventListener('input',e=>{if(e.target.id==='search'){if(view!=='projects')view='projects';render()}if(['light','contrast'].includes(e.target.id)){document.querySelector('#'+e.target.id+'Out').textContent=e.target.value;document.querySelector('#preview').style.filter=`brightness(${1+(+document.querySelector('#light').value)/100}) contrast(${1+(+document.querySelector('#contrast').value)/100})`}});render();
</script></html>
